<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Admin — Tus Casas Vacaciones</title>
  <script src="https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js" integrity="sha384-EnyY0/GSHQGSxSgMwaIPzSESbqoOLSexfnSMN2AP+39Ckmn92stwABZynq1JyzdT" crossorigin="anonymous"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #f4f4f5;
      color: #18181b;
      min-height: 100vh;
    }

    /* Login */
    #login-screen {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }

    .login-box {
      background: white;
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 360px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.08);
    }

    .login-box h1 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      text-align: center;
    }

    .login-box input {
      width: 100%;
      padding: 0.6rem 0.8rem;
      border: 1px solid #d4d4d8;
      border-radius: 8px;
      font-size: 0.95rem;
      margin-bottom: 1rem;
    }

    .login-box button {
      width: 100%;
      padding: 0.65rem;
      background: #2563eb;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
    }

    .login-box button:hover { background: #1d4ed8; }
    #login-error { color: #dc2626; font-size: 0.85rem; margin-top: 0.5rem; text-align: center; }

    /* App */
    #app { display: none; }

    header {
      background: white;
      border-bottom: 1px solid #e4e4e7;
      padding: 0.9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    header h1 { font-size: 1.1rem; font-weight: 600; }

    header button {
      padding: 0.4rem 0.9rem;
      background: #f4f4f5;
      border: 1px solid #d4d4d8;
      border-radius: 6px;
      font-size: 0.85rem;
      cursor: pointer;
    }

    nav {
      display: flex;
      gap: 0.5rem;
      padding: 1rem 1.5rem 0;
    }

    nav button {
      padding: 0.5rem 1.1rem;
      border: none;
      border-radius: 8px 8px 0 0;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      background: #e4e4e7;
      color: #52525b;
    }

    nav button.active {
      background: white;
      color: #2563eb;
      border-bottom: 2px solid #2563eb;
    }

    main {
      padding: 0 1.5rem 2rem;
      background: white;
      margin: 0 1.5rem 1.5rem;
      border-radius: 0 8px 8px 8px;
      border: 1px solid #e4e4e7;
      min-height: 400px;
    }

    .toolbar {
      display: flex;
      gap: 0.75rem;
      padding: 1rem 0;
      flex-wrap: wrap;
      align-items: center;
    }

    .toolbar input, .toolbar select {
      padding: 0.45rem 0.7rem;
      border: 1px solid #d4d4d8;
      border-radius: 6px;
      font-size: 0.875rem;
    }

    .toolbar input { width: 220px; }

    .count {
      margin-left: auto;
      font-size: 0.85rem;
      color: #71717a;
    }

    .btn-export {
      padding: 0.45rem 0.9rem;
      background: #16a34a;
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      cursor: pointer;
    }

    .btn-export:hover { background: #15803d; }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.875rem;
    }

    th {
      text-align: left;
      padding: 0.6rem 0.75rem;
      background: #f4f4f5;
      font-weight: 600;
      color: #52525b;
      border-bottom: 1px solid #e4e4e7;
      white-space: nowrap;
    }

    td {
      padding: 0.6rem 0.75rem;
      border-bottom: 1px solid #f4f4f5;
      vertical-align: top;
    }

    tr:hover td { background: #fafafa; }

    .badge {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 99px;
      font-size: 0.75rem;
      font-weight: 500;
      background: #dbeafe;
      color: #1d4ed8;
    }

    .empty {
      text-align: center;
      padding: 3rem;
      color: #a1a1aa;
      font-size: 0.9rem;
    }

    .loading {
      text-align: center;
      padding: 3rem;
      color: #a1a1aa;
    }
  </style>
</head>
<body>

<!-- Login -->
<div id="login-screen">
  <div class="login-box">
    <h1>Panel de Administración</h1>
    <input type="text" id="user-input" placeholder="Usuario" autocomplete="username" />
    <input type="password" id="token-input" placeholder="Contraseña" autocomplete="current-password" />
    <button onclick="login()">Entrar</button>
    <div id="login-error"></div>
  </div>
</div>

<!-- App -->
<div id="app">
  <header>
    <h1>Panel de Administración</h1>
    <button onclick="logout()">Salir</button>
  </header>

  <nav>
    <button class="active" onclick="showTab('reservas', this)">Reservas</button>
    <button onclick="showTab('contactos', this)">Contactos</button>
  </nav>

  <main>
    <!-- Reservas -->
    <div id="tab-reservas">
      <div class="toolbar">
        <input type="text" id="search-reservas" placeholder="Buscar nombre, email..." oninput="renderReservas()" />
        <select id="filter-propiedad" onchange="renderReservas()">
          <option value="">Todas las propiedades</option>
        </select>
        <span class="count" id="count-reservas"></span>
        <button class="btn-export" onclick="exportReservas()">Descargar Excel</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Propiedad</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Entrada</th>
              <th>Salida</th>
              <th>Noches</th>
              <th>Adultos</th>
              <th>Niños</th>
              <th>Precio</th>
              <th>Comentarios</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody id="tbody-reservas"></tbody>
        </table>
        <div id="loading-reservas" class="loading">Cargando...</div>
        <div id="empty-reservas" class="empty" style="display:none">Sin resultados</div>
      </div>
    </div>

    <!-- Contactos -->
    <div id="tab-contactos" style="display:none">
      <div class="toolbar">
        <input type="text" id="search-contactos" placeholder="Buscar nombre, email..." oninput="renderContactos()" />
        <span class="count" id="count-contactos"></span>
        <button class="btn-export" onclick="exportContactos()">Descargar Excel</button>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Nombre</th>
              <th>Email</th>
              <th>Teléfono</th>
              <th>Mensaje</th>
              <th>Fecha</th>
            </tr>
          </thead>
          <tbody id="tbody-contactos"></tbody>
        </table>
        <div id="loading-contactos" class="loading" style="display:none">Cargando...</div>
        <div id="empty-contactos" class="empty" style="display:none">Sin resultados</div>
      </div>
    </div>
  </main>
</div>

<script>
  const WORKER_URL = 'https://casitasdemar-form.eduardgomez-4.workers.dev';

  let token = '';
  let adminUser = '';
  let reservas = [];
  let contactos = [];
  let contactosLoaded = false;

  function login() {
    adminUser = document.getElementById('user-input').value.trim();
    token = document.getElementById('token-input').value.trim();
    if (!adminUser || !token) return;
    fetchReservas();
  }

  function logout() {
    token = '';
    adminUser = '';
    reservas = [];
    contactos = [];
    contactosLoaded = false;
    document.getElementById('login-screen').style.display = 'flex';
    document.getElementById('app').style.display = 'none';
    document.getElementById('user-input').value = '';
    document.getElementById('token-input').value = '';
    document.getElementById('login-error').textContent = '';
  }

  async function fetchReservas() {
    document.getElementById('loading-reservas').style.display = 'block';
    document.getElementById('tbody-reservas').innerHTML = '';
    document.getElementById('empty-reservas').style.display = 'none';

    try {
      const res = await fetch(`${WORKER_URL}/admin/reservas`, {
        headers: { Authorization: `Bearer ${token}`, 'X-Admin-User': adminUser }
      });

      if (res.status === 401) {
        document.getElementById('login-error').textContent = 'Token incorrecto.';
        document.getElementById('loading-reservas').style.display = 'none';
        return;
      }

      const { data } = await res.json();
      reservas = data || [];

      // Populate property filter
      const propiedades = [...new Set(reservas.map(r => r.propiedad).filter(Boolean))].sort();
      const sel = document.getElementById('filter-propiedad');
      sel.innerHTML = '<option value="">Todas las propiedades</option>';
      propiedades.forEach(p => {
        const opt = document.createElement('option');
        opt.value = p;
        opt.textContent = p;
        sel.appendChild(opt);
      });

      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('app').style.display = 'block';
      document.getElementById('loading-reservas').style.display = 'none';
      renderReservas();
    } catch (e) {
      document.getElementById('login-error').textContent = 'Error de conexión.';
      document.getElementById('loading-reservas').style.display = 'none';
    }
  }

  async function fetchContactos() {
    document.getElementById('loading-contactos').style.display = 'block';
    document.getElementById('tbody-contactos').innerHTML = '';
    document.getElementById('empty-contactos').style.display = 'none';

    const res = await fetch(`${WORKER_URL}/admin/contactos`, {
      headers: { Authorization: `Bearer ${token}`, 'X-Admin-User': adminUser }
    });
    const { data } = await res.json();
    contactos = data || [];
    contactosLoaded = true;
    document.getElementById('loading-contactos').style.display = 'none';
    renderContactos();
  }

  function renderReservas() {
    const search = document.getElementById('search-reservas').value.toLowerCase();
    const propiedad = document.getElementById('filter-propiedad').value;

    const filtered = reservas.filter(r => {
      const matchSearch = !search ||
        (r.nombre || '').toLowerCase().includes(search) ||
        (r.email || '').toLowerCase().includes(search) ||
        (r.telefono || '').toLowerCase().includes(search);
      const matchProp = !propiedad || r.propiedad === propiedad;
      return matchSearch && matchProp;
    });

    document.getElementById('count-reservas').textContent = `${filtered.length} reserva${filtered.length !== 1 ? 's' : ''}`;

    const tbody = document.getElementById('tbody-reservas');
    tbody.innerHTML = '';

    if (filtered.length === 0) {
      document.getElementById('empty-reservas').style.display = 'block';
      return;
    }
    document.getElementById('empty-reservas').style.display = 'none';

    filtered.forEach(r => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${esc(String(r.id))}</td>
        <td><span class="badge">${esc(r.propiedad)}</span></td>
        <td>${esc(r.nombre)}</td>
        <td><a href="mailto:${esc(r.email)}">${esc(r.email)}</a></td>
        <td>${esc(r.telefono)}</td>
        <td>${esc(r.entrada)}</td>
        <td>${esc(r.salida)}</td>
        <td>${esc(r.noches)}</td>
        <td>${esc(r.adultos)}</td>
        <td>${esc(r.ninos)}</td>
        <td>${esc(r.precio_total)}</td>
        <td style="max-width:200px;white-space:pre-wrap">${esc(r.comentarios)}</td>
        <td style="white-space:nowrap">${formatDate(r.created_at)}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function renderContactos() {
    const search = document.getElementById('search-contactos').value.toLowerCase();

    const filtered = contactos.filter(c =>
      !search ||
      (c.nombre || '').toLowerCase().includes(search) ||
      (c.email || '').toLowerCase().includes(search) ||
      (c.telefono || '').toLowerCase().includes(search)
    );

    document.getElementById('count-contactos').textContent = `${filtered.length} contacto${filtered.length !== 1 ? 's' : ''}`;

    const tbody = document.getElementById('tbody-contactos');
    tbody.innerHTML = '';

    if (filtered.length === 0) {
      document.getElementById('empty-contactos').style.display = 'block';
      return;
    }
    document.getElementById('empty-contactos').style.display = 'none';

    filtered.forEach(c => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${esc(String(c.id))}</td>
        <td>${esc(c.nombre)}</td>
        <td><a href="mailto:${esc(c.email)}">${esc(c.email)}</a></td>
        <td>${esc(c.telefono)}</td>
        <td style="max-width:280px;white-space:pre-wrap">${esc(c.mensaje)}</td>
        <td style="white-space:nowrap">${formatDate(c.created_at)}</td>
      `;
      tbody.appendChild(tr);
    });
  }

  function showTab(tab, btn) {
    document.getElementById('tab-reservas').style.display = tab === 'reservas' ? '' : 'none';
    document.getElementById('tab-contactos').style.display = tab === 'contactos' ? '' : 'none';
    document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    if (tab === 'contactos' && !contactosLoaded) fetchContactos();
  }

  document.getElementById('token-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') login();
  });

  function esc(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function exportReservas() {
    const search = document.getElementById('search-reservas').value.toLowerCase();
    const propiedad = document.getElementById('filter-propiedad').value;

    const filtered = reservas.filter(r => {
      const matchSearch = !search ||
        (r.nombre || '').toLowerCase().includes(search) ||
        (r.email || '').toLowerCase().includes(search) ||
        (r.telefono || '').toLowerCase().includes(search);
      const matchProp = !propiedad || r.propiedad === propiedad;
      return matchSearch && matchProp;
    });

    const rows = filtered.map(r => ({
      'ID': r.id,
      'Propiedad': r.propiedad,
      'Nombre': r.nombre,
      'Email': r.email,
      'Teléfono': r.telefono,
      'Entrada': r.entrada,
      'Salida': r.salida,
      'Noches': r.noches,
      'Adultos': r.adultos,
      'Niños': r.ninos,
      'Precio total': r.precio_total,
      'Comentarios': r.comentarios,
      'Fecha': r.created_at,
    }));

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Reservas');
    XLSX.writeFile(wb, `reservas_${today()}.xlsx`);
  }

  function exportContactos() {
    const search = document.getElementById('search-contactos').value.toLowerCase();

    const filtered = contactos.filter(c =>
      !search ||
      (c.nombre || '').toLowerCase().includes(search) ||
      (c.email || '').toLowerCase().includes(search) ||
      (c.telefono || '').toLowerCase().includes(search)
    );

    const rows = filtered.map(c => ({
      'ID': c.id,
      'Nombre': c.nombre,
      'Email': c.email,
      'Teléfono': c.telefono,
      'Mensaje': c.mensaje,
      'Fecha': c.created_at,
    }));

    const ws = XLSX.utils.json_to_sheet(rows);
    const wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'Contactos');
    XLSX.writeFile(wb, `contactos_${today()}.xlsx`);
  }

  function today() {
    return new Date().toISOString().slice(0, 10);
  }

  function formatDate(str) {
    if (!str) return '';
    const d = new Date(str);
    if (isNaN(d)) return str;
    return d.toLocaleDateString('es-ES', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
  }
</script>
</body>
</html>
