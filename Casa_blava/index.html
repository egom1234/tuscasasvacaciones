<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Casa Blava Peñíscola - Alquiler vacacional</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- ================= CONFIG PROPIEDAD ================= -->
  <script>
    window.PAGE_CONFIG = {
      slug: "casa-blava",
      name: "Casa Blava Peñíscola",
      lang: "es",
      maxPersonas: 6,
      cleaning: 75,

      icalSlugs: [
        "casablava-airbnb",
        "casablava-booking"
      ],

      rates: {
        "5": { weekday: 140, weekend: 190 },
        "6": { weekday: 160, weekend: 200 },
        "7": 250,
        "8": 260,
        "9": { weekday: 150, weekend: 180 }
      },

      holidays: ["12-24", "12-25", "12-31"]
    };
  </script>
</head>

<body>

<!-- ================= RESERVA ================= -->

<section class="reserva">

  <h2>Reserva tu estancia</h2>

  <!-- ===== CALENDARIO ===== -->
  <div class="calendar-container">

    <div class="calendar-header">
      <button type="button" onclick="mesActual--; renderCalendario()">‹</button>
      <span id="mesActual"></span>
      <button type="button" onclick="mesActual++; renderCalendario()">›</button>
    </div>

    <div id="calendarioGrid" class="calendar-grid"></div>

    <!-- inputs ocultos sincronizados con JS -->
    <input type="date" id="fechaEntrada" name="fechaEntrada" hidden>
    <input type="date" id="fechaSalida" name="fechaSalida" hidden>

  </div>

  <!-- ===== IMPORTE ===== -->
  <div class="importe-estimado">

    <h3>Importe estimado</h3>

    <p>Noches: <strong><span id="nightsCount">0</span></strong></p>
    <p>Subtotal: <strong><span id="subtotalAmount">0 €</span></strong></p>
    <p>Limpieza: <strong><span id="cleaningAmount">75 €</span></strong></p>
    <p class="total">
      Total:
      <strong><span id="totalAmount">Selecciona fechas</span></strong>
    </p>

  </div>

</section>

<!-- ================= FORMULARIO ================= -->

<section class="formulario">

  <form id="formularioReserva">

    <h3>Solicitar reserva</h3>

    <label>
      Adultos
      <input type="number" name="adultos" min="1" value="2" required>
    </label>

    <label>
      Niños
      <input type="number" name="ninos" min="0" value="0">
    </label>

    <label>
      Nombre completo
      <input type="text" name="name" required>
    </label>

    <label>
      Email
      <input type="email" name="email" required>
    </label>

    <label>
      Teléfono
      <input type="tel" name="telefono">
    </label>

    <label>
      Comentarios
      <textarea name="comentarios"></textarea>
    </label>

    <button type="submit">Solicitar reserva</button>

  </form>

</section>

<!-- ================= WHATSAPP ================= -->

<section class="contacto-wa">

  <a
    data-wa="https://wa.me/34613119183"
    target="_blank"
    rel="noopener"
    class="btn-whatsapp"
  >
    📱 Contactar por WhatsApp
  </a>

</section>

<!-- ================= SCRIPTS ================= -->

<script src="/js/property-page.js"></script>
<script src="/js/calendar.js"></script>
<script src="/js/pricing.js"></script>
<script src="/js/form.js"></script>
<script src="/js/whatsapp.js"></script>

</body>
</html>
